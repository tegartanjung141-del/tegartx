<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic Arm 3D - OpenCascade WebGL</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-container {
            position: absolute; top: 20px; right: 20px; width: 320px;
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 12px; border: 1px solid rgba(79, 172, 254, 0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); user-select: none;
        }
        h2 { margin: 0 0 20px 0; font-size: 20px; color: #4facfe; text-transform: uppercase; letter-spacing: 2px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .control-group { margin-bottom: 18px; }
        label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #aaa; font-weight: 600; }
        input[type=range] { 
            width: 100%; cursor: pointer; accent-color: #4facfe; 
            background: #333; height: 6px; border-radius: 3px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; background: #4facfe; border-radius: 50%; cursor: pointer; transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .value-display { color: #4facfe; font-family: monospace; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1; padding: 12px; background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4); }
        button:active { transform: translateY(0); }
        button.secondary { background: #333; border: 1px solid #555; }
        button.secondary:hover { background: #444; box-shadow: none; }
        
        #status { position: absolute; bottom: 20px; left: 20px; font-size: 12px; color: #666; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4facfe; font-size: 24px; font-weight: bold; pointer-events: none; transition: opacity 0.5s; }
    </style>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="loading" class="loading">Loading 3D Engine...</div>

<div id="ui-container">
    <h2>Robotic Control</h2>
    
    <div class="control-group">
        <label>Base Rotation (J1) <span id="val-j1" class="value-display">0°</span></label>
        <input type="range" id="j1" min="-180" max="180" value="0">
    </div>

    <div class="control-group">
        <label>Shoulder Lift (J2) <span id="val-j2" class="value-display">45°</span></label>
        <input type="range" id="j2" min="-90" max="90" value="45">
    </div>

    <div class="control-group">
        <label>Elbow Pitch (J3) <span id="val-j3" class="value-display">-45°</span></label>
        <input type="range" id="j3" min="-90" max="90" value="-45">
    </div>

    <div class="control-group">
        <label>Wrist Roll (J4) <span id="val-j4" class="value-display">0°</span></label>
        <input type="range" id="j4" min="-180" max="180" value="0">
    </div>

    <div class="control-group">
        <label>Gripper State <span id="val-grip" class="value-display">Open</span></label>
        <input type="range" id="grip" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="btn-group">
        <button onclick="toggleAnimation()" id="btn-anim">Auto Demo</button>
        <button class="secondary" onclick="resetRobot()">Reset</button>
    </div>
</div>

<div id="status">WebGL 3D Renderer Active | Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>

<script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    scene.fog = new THREE.FogExp2(0x111111, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Hide loading text
    setTimeout(() => {
        const loader = document.getElementById('loading');
        if(loader) loader.style.opacity = 0;
    }, 1000);

    // --- Controls ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 50;
    controls.minDistance = 2;

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(0x404040, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x4facfe, 0.8, 50);
    pointLight.position.set(-5, 5, -5);
    scene.add(pointLight);

    // --- Environment ---
    const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    scene.add(gridHelper);

    const planeGeo = new THREE.PlaneGeometry(50, 50);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, metalness: 0.2 });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.receiveShadow = true;
    scene.add(plane);

    // --- Robot Materials ---
    const matBase = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3, metalness: 0.8 });
    const matJoint = new THREE.MeshStandardMaterial({ color: 0x0077ff, roughness: 0.2, metalness: 0.6, emissive: 0x001133 });
    const matArm = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.4, metalness: 0.3 });
    const matGripper = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.4, metalness: 0.5 });

    // --- Robot Hierarchy Construction ---
    const robotRoot = new THREE.Group();
    scene.add(robotRoot);

    // 1. Static Base
    const baseGeo = new THREE.CylinderGeometry(2.2, 2.5, 0.8, 32);
    const baseMesh = new THREE.Mesh(baseGeo, matBase);
    baseMesh.position.y = 0.4;
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    robotRoot.add(baseMesh);

    // 2. Joint 1 (Base Rotation)
    const j1Group = new THREE.Group();
    j1Group.position.y = 0.8;
    robotRoot.add(j1Group);

    const j1Geo = new THREE.CylinderGeometry(1.8, 1.8, 1.2, 32);
    const j1Mesh = new THREE.Mesh(j1Geo, matJoint);
    j1Mesh.position.y = 0.6;
    j1Mesh.castShadow = true;
    j1Group.add(j1Mesh);

    // Decorative ring
    const ringGeo = new THREE.TorusGeometry(1.5, 0.1, 16, 32);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.2;
    j1Group.add(ring);

    // 3. Lower Arm (Attached to J1 rotation)
    const lowerArmGroup = new THREE.Group();
    lowerArmGroup.position.y = 1.2;
    j1Group.add(lowerArmGroup);

    const lowerArmGeo = new THREE.BoxGeometry(1.2, 4, 1.2);
    const lowerArmMesh = new THREE.Mesh(lowerArmGeo, matArm);
    lowerArmMesh.position.y = 2;
    lowerArmMesh.castShadow = true;
    lowerArmGroup.add(lowerArmMesh);

    // 4. Joint 2 (Shoulder)
    const j2Group = new THREE.Group();
    j2Group.position.y = 4;
    lowerArmGroup.add(j2Group);

    const j2Geo = new THREE.SphereGeometry(1.4, 32, 32);
    const j2Mesh = new THREE.Mesh(j2Geo, matJoint);
    j2Mesh.castShadow = true;
    j2Group.add(j2Mesh);

    // 5. Upper Arm (Attached to J2 rotation)
    const upperArmGroup = new THREE.Group();
    j2Group.add(upperArmGroup);

    const upperArmGeo = new THREE.BoxGeometry(1, 3.5, 1);
    const upperArmMesh = new THREE.Mesh(upperArmGeo, matArm);
    upperArmMesh.position.y = 1.75;
    upperArmMesh.castShadow = true;
    upperArmGroup.add(upperArmMesh);

    // 6. Joint 3 (Elbow)
    const j3Group = new THREE.Group();
    j3Group.position.y = 3.5;
    upperArmGroup.add(j3Group);

    const j3Geo = new THREE.SphereGeometry(1.1, 32, 32);
    const j3Mesh = new THREE.Mesh(j3Geo, matJoint);
    j3Mesh.castShadow = true;
    j3Group.add(j3Mesh);

    // 7. Wrist Assembly
    const wristGroup = new THREE.Group();
    j3Group.add(wristGroup);

    const wristGeo = new THREE.CylinderGeometry(0.8, 0.6, 1.5, 32);
    const wristMesh = new THREE.Mesh(wristGeo, matArm);
    wristMesh.position.y = 0.75;
    wristMesh.castShadow = true;
    wristGroup.add(wristMesh);

    // 8. Joint 4 (Wrist Rotation)
    const j4Group = new THREE.Group();
    j4Group.position.y = 1.5;
    wristGroup.add(j4Group);

    // Gripper Base
    const gBaseGeo = new THREE.BoxGeometry(1.4, 0.6, 1.4);
    const gBaseMesh = new THREE.Mesh(gBaseGeo, matBase);
    gBaseMesh.castShadow = true;
    j4Group.add(gBaseMesh);

    // Gripper Fingers
    const fingerGeo = new THREE.BoxGeometry(0.25, 1.2, 0.5);
    
    const leftFinger = new THREE.Mesh(fingerGeo, matGripper);
    leftFinger.position.set(-0.5, 0.6, 0);
    leftFinger.castShadow = true;
    j4Group.add(leftFinger);

    const rightFinger = new THREE.Mesh(fingerGeo, matGripper);
    rightFinger.position.set(0.5, 0.6, 0);
    rightFinger.castShadow = true;
    j4Group.add(rightFinger);

    // --- Logic & Interaction ---
    const inputs = {
        j1: document.getElementById('j1'),
        j2: document.getElementById('j2'),
        j3: document.getElementById('j3'),
        j4: document.getElementById('j4'),
        grip: document.getElementById('grip')
    };

    const displays = {
        j1: document.getElementById('val-j1'),
        j2: document.getElementById('val-j2'),
        j3: document.getElementById('val-j3'),
        j4: document.getElementById('val-j4'),
        grip: document.getElementById('val-grip')
    };

    let isAnimating = false;
    let animTime = 0;

    function updateRobot() {
        const v1 = parseFloat(inputs.j1.value);
        const v2 = parseFloat(inputs.j2.value);
        const v3 = parseFloat(inputs.j3.value);
        const v4 = parseFloat(inputs.j4.value);
        const vg = parseFloat(inputs.grip.value);

        // Apply Rotations
        j1Group.rotation.y = THREE.MathUtils.degToRad(v1);
        
        // Note: In this hierarchy, rotating the group rotates its children
        // We rotate the "Arm Group" relative to the joint
        lowerArmGroup.rotation.x = THREE.MathUtils.degToRad(-v2); 
        upperArmGroup.rotation.x = THREE.MathUtils.degToRad(-v3);
        wristGroup.rotation.x = THREE.MathUtils.degToRad(-v4);

        // Gripper Logic
        const spread = 0.5 + (0.6 * (1 - vg)); // Max spread ~1.1, Min ~0.5
        leftFinger.position.x = -spread;
        rightFinger.position.x = spread;
        
        // Visual tilt for fingers when closing
        const tilt = vg * 0.2;
        leftFinger.rotation.z = tilt;
        rightFinger.rotation.z = -tilt;

        // Update UI Text
        displays.j1.innerText = v1.toFixed(0) + "°";
        displays.j2.innerText = v2.toFixed(0) + "°";
        displays.j3.innerText = v3.toFixed(0) + "°";
        displays.j4.innerText = v4.toFixed(0) + "°";
        displays.grip.innerText = vg > 0.8 ? "CLOSED" : (vg < 0.2 ? "OPEN" : "GRABBING");
        displays.grip.style.color = vg > 0.8 ? "#ff3333" : "#4facfe";
    }

    function toggleAnimation() {
        isAnimating = !isAnimating;
        const btn = document.getElementById('btn-anim');
        btn.innerText = isAnimating ? "Stop Demo" : "Auto Demo";
        btn.style.background = isAnimating ? "linear-gradient(135deg, #ff4b4b, #ff904b)" : "";
        if(isAnimating) animateLoop();
    }

    function resetRobot() {
        inputs.j1.value = 0;
        inputs.j2.value = 45;
        inputs.j3.value = -45;
        inputs.j4.value = 0;
        inputs.grip.value = 0;
        isAnimating = false;
        document.getElementById('btn-anim').innerText = "Auto Demo";
        document.getElementById('btn-anim').style.background = "";
        updateRobot();
    }

    function animateLoop() {
        if (!isAnimating) return;
        animTime += 0.015;
        
        inputs.j1.value = Math.sin(animTime) * 120;
        inputs.j2.value = 30 + Math.cos(animTime * 0.8) * 40;
        inputs.j3.value = -30 + Math.sin(animTime * 0.8) * 50;
        inputs.j4.value = Math.sin(animTime * 2) * 90;
        
        // Complex gripper motion
        const gripCycle = (Math.sin(animTime * 1.5) + 1) / 2;
        inputs.grip.value = gripCycle > 0.8 ? 1 : 0; // Snap open/close
        
        updateRobot();
        requestAnimationFrame(animateLoop);
    }

    // Event Listeners
    Object.values(inputs).forEach(input => {
        input.addEventListener('input', updateRobot);
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Init
    updateRobot();

    // Render Loop
    function render() {
        requestAnimationFrame(render);
        controls.update();
        renderer.render(scene, camera);
    }
    render();
</script>
</body>
</html>
